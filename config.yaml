# MariFindX — central configuration
# Every tunable parameter in the ML + services chain lives here.

project:
  name: MariFindX
  version: "3.0.0"

# ----------------------------------------------------------------------
# Data paths. Point `root` at wherever the Zenodo archives were extracted.
# ----------------------------------------------------------------------
data:
  root: data/raw
  # Zenodo Part I  (oil) and Part II (no-oil + look-alike) supply train/val.
  # Zenodo Part III supplies the held-out test set.
  oil_dir: data/raw/oil
  lookalike_dir: data/raw/lookalike
  nooil_dir: data/raw/nooil
  test_dir: data/raw/test
  demo_dir: data/demo
  processed_dir: data/processed
  synthetic_dir: data/synthetic

  # Filenames are matched image<->mask by stem. Masks may live in a
  # sibling directory named by `mask_subdir` or share the image dir.
  image_subdir: images
  mask_subdir: masks
  image_glob: "*.tif*"

  # Quick mode caps how many images per class are loaded (§2 Mode A).
  quick_limits:
    oil: 200
    lookalike: 200
    nooil: 200
  # null => use everything found (Mode B).
  full_limits:
    oil: null
    lookalike: null
    nooil: null

  val_fraction: 0.2
  # Splitting is done at IMAGE level, never patch level, to avoid leakage.
  split_seed: 1337

# ----------------------------------------------------------------------
# Preprocessing — Sentinel-1 Sigma0 dB, VV + VH
# ----------------------------------------------------------------------
preprocessing:
  channels: ["VV", "VH"]
  # Sigma0 dB clipping range before normalisation. Values outside are
  # clamped; these bounds cover the usual ocean-surface backscatter span.
  db_clip:
    VV: [-35.0, 5.0]
    VH: [-40.0, 0.0]
  # "minmax" maps the clip range to [0,1]; "zscore" uses per-image stats.
  normalisation: minmax
  nodata_value: 0.0

# ----------------------------------------------------------------------
# Patching (§6) — never feed raw 2048x2048 unless patch.enabled = false
# ----------------------------------------------------------------------
patch:
  enabled: true
  size: 512
  stride: 512          # equal to size => no overlap during training
  test_stride: 256     # overlap at inference for smoother seams
  # Discard training patches that are almost entirely nodata.
  min_valid_fraction: 0.10
  # Keep this share of all-negative (no oil pixel) patches so the model
  # still learns what clean ocean and look-alikes look like.
  negative_patch_keep: 0.35

# ----------------------------------------------------------------------
# Model (§3)
# ----------------------------------------------------------------------
model:
  architecture: attention_unet
  encoder: resnet34        # resnet34 | efficientnet_b0 | plain
  pretrained: false        # set true to pull torchvision ImageNet weights
  in_channels: 2           # VV + VH — first conv is re-built, not duplicated
  out_channels: 1
  base_width: 32
  dropout: 0.10

# ----------------------------------------------------------------------
# Loss (§4)  L = a*Dice + b*BCE + c*Focal
# ----------------------------------------------------------------------
loss:
  mode: hybrid             # hybrid | tversky
  dice_weight: 0.5
  bce_weight: 0.3
  focal_weight: 0.2
  focal_gamma: 2.0
  focal_alpha: 0.25
  # Positive-class weighting for BCE; oil pixels are a small minority.
  bce_pos_weight: 3.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  smooth: 1.0

# ----------------------------------------------------------------------
# Training (§5, §10, §11)
# ----------------------------------------------------------------------
training:
  epochs: 20
  batch_size: 8
  cpu_batch_size: 2        # used automatically when CUDA is absent
  num_workers: 4
  cpu_num_workers: 0
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine        # cosine | plateau | none
  warmup_epochs: 1
  amp: true                # honoured only when CUDA is present
  grad_clip: 1.0
  early_stopping:
    enabled: true
    patience: 6
    monitor: val_dice      # val_dice | val_iou | val_loss
  seed: 1337

# ----------------------------------------------------------------------
# Inference + confidence (§13, §16)
# ----------------------------------------------------------------------
inference:
  threshold: 0.5
  min_region_pixels: 200   # drop specks below this before polygonising
  # Confidence is an aggregate over the predicted region, not max(prob).
  confidence:
    high: 0.75
    medium: 0.55
  # Look-alike guard (§17): regions failing these tests are demoted.
  lookalike_guard:
    enabled: true
    min_mean_probability: 0.45
    max_aspect_ratio: 40.0
    min_area_km2: 0.05

# ----------------------------------------------------------------------
# Drift simulation (§18, §19, §20)
# ----------------------------------------------------------------------
drift:
  mode: synthetic          # synthetic | adapter
  particles: 500           # 100 | 500 | 1000 | 5000
  integrator: rk2          # rk2 (quick) | rk4 (advanced)
  timestep_minutes: 15
  windage: 0.03            # fraction of wind speed transferred to slick
  diffusion_m2_s: 8.0      # stochastic horizontal diffusivity
  backtrack_hours: 24      # how far back to search for the origin
  # Deterministic synthetic environment for the demo scenario.
  synthetic_field:
    current_speed_ms: 0.35
    current_direction_deg: 145.0
    wind_speed_ms: 6.4
    wind_direction_deg: 180.0
  seed: 20260921

# ----------------------------------------------------------------------
# AIS (§21, §22, §25)
# ----------------------------------------------------------------------
ais:
  source: auto             # auto | file | synthetic
  file: null               # MarineCadastre-style CSV when source=file
  candidate_radius_km: 25.0
  release_window_pad_hours: 2.0
  min_points_per_track: 4
  synthetic:
    vessels: 9
    seed: 20260921
    hours_before_release: 6
    hours_after_release: 6
    sample_interval_minutes: 10

# ----------------------------------------------------------------------
# Correlation scoring (§23) — prototype weights, not universal constants
# ----------------------------------------------------------------------
correlation:
  weights:
    proximity: 0.25
    temporal: 0.20
    trajectory: 0.20
    origin: 0.20
    drift: 0.15
  proximity_half_distance_km: 8.0
  temporal_half_window_hours: 3.0
  heading_tolerance_deg: 45.0

# ----------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------
paths:
  models_dir: models
  results_dir: results
  checkpoint_name: marifindx_oil_segmentation.pt
  metadata_name: model_metadata.json
